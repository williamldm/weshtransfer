<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A12">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WeshTransfer</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=95">
<script type="module" src="js/wallpaper-boot.js?v=95" blocking="render"></script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/+esm">
</head>
<body class="app">

<div class="scene" aria-hidden="true"></div>

<header class="app-header" id="header"></header>

<!-- Une seule vue montée à la fois (routeur à hash) :
     #/projects, #/p/<id>, #/f/<id>, #/send, #/transfers -->
<main class="app-main" id="view">
  <div class="skeleton tall"></div>
</main>

<!-- Lecteur persistant : il survit à la navigation entre les vues. -->
<div class="player" id="player"></div>

<div id="sheets"></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js?v=95"></script>
</body>
</html>
