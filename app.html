<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="robots" content="noindex">
<title>Seminaire</title>
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<header class="app-header">
  <button class="btn btn-ghost btn-icon" id="nav-back" aria-label="Retour" hidden>&#8592;</button>
  <div class="title" id="space-title">Seminaire</div>
  <button class="btn btn-ghost btn-icon" id="nav-people" aria-label="Participants">&#128100;</button>
</header>

<!-- Une seule vue montee a la fois, injectee par le routeur (hash) :
     #/projects, #/p/<id>, #/f/<id> -->
<main class="app-main" id="view"></main>

<!-- Lecteur persistant : il survit a la navigation entre les vues, sinon
     le son se coupe des qu'on ouvre un autre morceau. -->
<div class="player" id="player" aria-live="off">
  <button class="btn play" id="player-toggle" aria-label="Lecture">&#9654;</button>
  <div class="info">
    <div class="t" id="player-title">-</div>
    <div class="s"><span id="player-time">0:00</span> / <span id="player-duration">0:00</span></div>
  </div>
  <button class="btn btn-ghost btn-icon" id="player-close" aria-label="Fermer">&#10005;</button>
</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="js/app.js?v=1"></script>
</body>
</html>
