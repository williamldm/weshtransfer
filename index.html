<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover : l'appli passe sous l'encoche, les marges de
     sécurité sont gérées en CSS avec env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Séminaire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c0f'/%3E%3Cpath d='M7 20v-8M12 24V8M17 21v-10M22 18v-4M25 17v-2' stroke='%23ff9142' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css?v=8">
</head>
<body>

<main class="join">
  <div class="join-brand">
    <div class="brand-mark" aria-hidden="true">
      <i style="height:40%"></i><i style="height:85%"></i><i style="height:60%"></i><i style="height:100%"></i><i style="height:45%"></i><i style="height:70%"></i><i style="height:30%"></i>
    </div>
    <h1>Séminaire</h1>
    <p class="sub">Les sons du groupe, au même endroit.</p>
  </div>

  <div class="resume-list" id="resume" hidden></div>

  <form id="join-form" novalidate>
    <div class="field">
      <label class="label" for="code">Code de l'espace</label>
      <input class="input input-code" id="code" name="code"
             autocapitalize="characters" autocomplete="off"
             autocorrect="off" spellcheck="false" maxlength="8"
             placeholder="ABC123" required>
    </div>

    <div class="field">
      <label class="label" for="pseudo">Ton blaze</label>
      <input class="input" id="pseudo" name="pseudo"
             autocomplete="nickname" maxlength="24"
             placeholder="Comment on te reconnaît" required>
    </div>

    <button class="btn btn-primary btn-block btn-xl" id="join-submit" type="submit">
      Entrer
    </button>

    <p class="form-error" id="join-error" role="alert" hidden></p>
  </form>

  <p class="join-foot">Pas de compte à créer. Tes fichiers sont supprimés automatiquement après le séminaire.</p>
</main>

<script type="module" src="js/join.js?v=8"></script>
</body>
</html>
