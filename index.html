<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover : l'appli va sous l'encoche, les marges de securite
     sont gerees en CSS avec env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="robots" content="noindex">
<title>Seminaire</title>
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<main class="join">
  <div class="join-brand">
    <h1>Seminaire</h1>
    <p class="sub">Les sons du groupe, au meme endroit.</p>
  </div>

  <form id="join-form" novalidate>
    <div class="field">
      <label class="label" for="code">Code de l&apos;espace</label>
      <input class="input input-code" id="code" name="code"
             inputmode="latin" autocapitalize="characters" autocomplete="off"
             autocorrect="off" spellcheck="false" maxlength="8"
             placeholder="ABC123" required>
    </div>

    <div class="field">
      <label class="label" for="pseudo">Ton blaze</label>
      <input class="input" id="pseudo" name="pseudo"
             autocomplete="nickname" maxlength="24"
             placeholder="Comment on te reconnait" required>
    </div>

    <button class="btn btn-primary btn-block" id="join-submit" type="submit">
      Entrer
    </button>

    <p class="empty" id="join-error" role="alert" hidden></p>
  </form>
</main>

<script type="module" src="js/join.js?v=1"></script>
</body>
</html>
