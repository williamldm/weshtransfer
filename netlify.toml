# Netlify : prépare le dossier public (_deploy) puis le publie.
# Les migrations SQL, les outils et les bancs d'essai ne sont jamais en ligne.
[build]
  command = "python3 tools/build.py"
  publish = "_deploy"

# Les pages et scripts changent à chaque version (?v=N) : le HTML ne doit
# jamais rester en cache, sinon il pointerait vers d'anciens scripts.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# La page destinataire ne doit pas fuiter le lien privé vers d'autres sites.
[[headers]]
  for = "/t.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# Mêmes protections que le .htaccess d'o2switch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.backblazeb2.com https://mqjzzcnzbsbhololiiyw.supabase.co; media-src 'self' blob: https://*.backblazeb2.com https://mqjzzcnzbsbhololiiyw.supabase.co; connect-src 'self' https://mqjzzcnzbsbhololiiyw.supabase.co wss://mqjzzcnzbsbhololiiyw.supabase.co https://*.backblazeb2.com https://cdn.jsdelivr.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
