<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Une centrale au charbon, la nuit">
<style>
.smoke{animation:drift 31s linear infinite;transform-box:fill-box;transform-origin:50% 100%;opacity:0}
@keyframes drift{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:.95}100%{transform:translate(300px,-360px) scale(2.2);opacity:0}}
.blink{animation:blink 2.6s steps(1) infinite}
@keyframes blink{50%{opacity:.1}}
.jet{animation:fly 70s linear infinite}
@keyframes fly{0%{transform:translate(-160px,40px)}100%{transform:translate(1800px,-90px)}}
@media (prefers-reduced-motion:reduce){.smoke,.jet,.blink{animation:none}.smoke{opacity:.8}}
</style>
